name: CI

on:
  pull_request:
    branches: [ main, develop, tests ]
  push:
    branches: [ main, develop, tests ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: WMARS/WMARS.slnx

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }}

      - name: Run Tests
        run: dotnet test ${{ env.SOLUTION }} --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Check Code Coverage
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet diff-cover
          diff-cover $(find TestResults -name 'coverage.cobertura.xml') --compare-branch=origin/${{ github.base_ref }} --fail-under=70
